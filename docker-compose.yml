services:
  postgres:
    image: postgres:16-alpine
    container_name: offline-ai-postgres
    environment:
      POSTGRES_DB: offline_ai
      POSTGRES_USER: offline_ai
      POSTGRES_PASSWORD: offline_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U offline_ai -d offline_ai
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
