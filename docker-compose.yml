services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: offline-ai-api
    environment:
      APP_NAME: Offline Intelligence Hub API
      APP_VERSION: 0.2.0
      ENVIRONMENT: development
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://offline_ai:offline_ai@postgres:5432/offline_ai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-production
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      MAX_UPLOAD_SIZE_BYTES: 5242880
      EMBEDDING_DIMENSIONS: 768
      LLM_BACKEND: fake
      LLM_BASE_URL: http://host.docker.internal:8080/v1
      LLM_MODEL: ggml-org/gemma-3-1b-it-GGUF:Q4_K_M
      LLM_TIMEOUT_SECONDS: 60
      LLM_MAX_TOTAL_MESSAGE_CHARS: 50000
      LLM_MAX_COMPLETION_TOKENS: 2048
      LLM_MAX_CONCURRENT_REQUESTS: 1
    ports:
      - "8000:8000"
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10

  api-tests:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles:
      - test
    environment:
      APP_NAME: Offline Intelligence Hub API
      APP_VERSION: 0.2.0
      ENVIRONMENT: testing
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://offline_ai:offline_ai@postgres:5432/offline_ai_test
      TEST_DATABASE_ADMIN_URL: postgresql://offline_ai:offline_ai@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-production
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      DOCUMENT_STORAGE_DIR: /tmp/offline-intelligence-hub-tests/documents
      MAX_UPLOAD_SIZE_BYTES: 5242880
      EMBEDDING_DIMENSIONS: 768
      LLM_BACKEND: fake
      LLM_BASE_URL: http://host.docker.internal:8080/v1
      LLM_MODEL: ggml-org/gemma-3-1b-it-GGUF:Q4_K_M
      LLM_TIMEOUT_SECONDS: 60
      LLM_MAX_TOTAL_MESSAGE_CHARS: 50000
      LLM_MAX_COMPLETION_TOKENS: 2048
      LLM_MAX_CONCURRENT_REQUESTS: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command:
      - python
      - launcher.py
      - test

  redis:
    image: redis:7-alpine
    container_name: offline-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: offline-ai-postgres
    environment:
      POSTGRES_DB: offline_ai
      POSTGRES_USER: offline_ai
      POSTGRES_PASSWORD: offline_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U offline_ai -d offline_ai
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_storage:
  postgres_data:
