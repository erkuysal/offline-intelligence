x-api-environment: &api-environment
  APP_NAME: Offline Intelligence Hub API
  APP_VERSION: ${APP_VERSION:-0.5.0}
  ENVIRONMENT: production
  DEBUG: "false"
  HOST: 0.0.0.0
  PORT: 8000
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-offline_ai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/env/prod.env}@postgres:5432/${POSTGRES_DB:-offline_ai}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in config/env/prod.env}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  JWT_REFRESH_TOKEN_EXPIRE_MINUTES: ${JWT_REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
  DOCUMENT_STORAGE_DIR: /app/storage/documents
  MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-5242880}
  DOCUMENT_INGESTION_MODE: redis
  DOCUMENT_INGESTION_QUEUE_NAME: ${DOCUMENT_INGESTION_QUEUE_NAME:-document_ingestion}
  DOCUMENT_INGESTION_WORKER_POLL_SECONDS: ${DOCUMENT_INGESTION_WORKER_POLL_SECONDS:-5}
  DOCUMENT_INGESTION_MAX_ATTEMPTS: ${DOCUMENT_INGESTION_MAX_ATTEMPTS:-3}
  DOCUMENT_CHUNK_SIZE_CHARS: ${DOCUMENT_CHUNK_SIZE_CHARS:-2000}
  DOCUMENT_CHUNK_OVERLAP_CHARS: ${DOCUMENT_CHUNK_OVERLAP_CHARS:-200}
  EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-openai_compatible}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8080/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma-300m}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  EMBEDDING_REINDEX_BATCH_SIZE: ${EMBEDDING_REINDEX_BATCH_SIZE:-32}
  RAG_RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT:-5}
  RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-12000}
  LLM_BACKEND: ${LLM_BACKEND:-openai_compatible}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
  LLM_MODEL: ${LLM_MODEL:-ggml-org/gemma-3-1b-it-GGUF:Q4_K_M}
  LLM_ADAPTER_ID: ${LLM_ADAPTER_ID:-}
  LLM_ADAPTER_SHA256: ${LLM_ADAPTER_SHA256:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_WARMUP_ENABLED: ${LLM_WARMUP_ENABLED:-true}
  LLM_WARMUP_TIMEOUT_SECONDS: ${LLM_WARMUP_TIMEOUT_SECONDS:-5}
  LLM_WARMUP_RETRY_SECONDS: ${LLM_WARMUP_RETRY_SECONDS:-10}
  LLM_MAX_TOTAL_MESSAGE_CHARS: ${LLM_MAX_TOTAL_MESSAGE_CHARS:-50000}
  LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-2048}
  LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-1}

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  ulimits:
    nofile:
      soft: ${RUNTIME_NOFILE_SOFT:-4096}
      hard: ${RUNTIME_NOFILE_HARD:-8192}
  logging:
    driver: json-file
    options:
      max-size: ${RUNTIME_LOG_MAX_SIZE:-10m}
      max-file: ${RUNTIME_LOG_MAX_FILES:-3}

x-llm-model-service: &llm-model-service
  <<: *runtime-hardening
  entrypoint:
    - /bin/sh
    - -ec
  user: ${MODEL_RUNTIME_USER:-65532:65532}
  volumes:
    - ${MODEL_DIR:-../var/models}:/models:ro
  tmpfs:
    - /tmp:mode=1777
  pids_limit: ${MODEL_PIDS_LIMIT:-256}
  mem_limit: ${LLM_MEMORY_LIMIT:-8g}
  cpus: ${MODEL_CPU_LIMIT:-8.0}
  restart: unless-stopped
  networks:
    application:
      aliases:
        - llm

x-embedding-model-service: &embedding-model-service
  <<: *runtime-hardening
  entrypoint:
    - /bin/sh
    - -ec
  user: ${MODEL_RUNTIME_USER:-65532:65532}
  volumes:
    - ${MODEL_DIR:-../var/models}:/models:ro
  tmpfs:
    - /tmp:mode=1777
  pids_limit: ${MODEL_PIDS_LIMIT:-256}
  mem_limit: ${EMBEDDING_MEMORY_LIMIT:-4g}
  cpus: ${MODEL_CPU_LIMIT:-8.0}
  restart: unless-stopped
  networks:
    application:
      aliases:
        - embedding

name: offline-intelligence-hub-production

services:
  web:
    <<: *runtime-hardening
    image: ${WEB_IMAGE:-offline-intelligence-hub-web:0.5.0}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    entrypoint:
      - nginx
      - -g
      - daemon off;
    user: "101:101"
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0750
    pids_limit: ${WEB_PIDS_LIMIT:-128}
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-1.0}
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application
      - edge

  api:
    <<: *runtime-hardening
    image: ${API_IMAGE:-offline-intelligence-hub-api:0.5.0}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    volumes:
      - api_storage:/app/storage
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0750
    user: "10001:10001"
    pids_limit: ${API_PIDS_LIMIT:-256}
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPU_LIMIT:-2.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - application

  ingestion-worker:
    <<: *runtime-hardening
    image: ${INGESTION_WORKER_IMAGE:-offline-intelligence-hub-ingestion-worker:0.5.0}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    volumes:
      - api_storage:/app/storage
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0750
    user: "10001:10001"
    pids_limit: ${WORKER_PIDS_LIMIT:-256}
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command:
      - python
      - launcher.py
      - ingestion-worker
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - application

  redis:
    <<: *runtime-hardening
    image: redis:7-alpine
    user: "999:1000"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:uid=999,gid=1000,mode=0750
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    mem_limit: ${REDIS_MEMORY_LIMIT:-1g}
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - application

  postgres:
    <<: *runtime-hardening
    image: pgvector/pgvector:0.8.2-pg16
    user: "999:999"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offline_ai}
      POSTGRES_USER: ${POSTGRES_USER:-offline_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/env/prod.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:uid=999,gid=999,mode=1770
      - /var/run/postgresql:uid=999,gid=999,mode=3770
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-offline_ai} -d ${POSTGRES_DB:-offline_ai}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - application

  llm-cpu:
    <<: *llm-model-service
    profiles:
      - models-cpu
    image: ${LLAMA_CPP_CPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b9445}
    command:
      - |
        model="/models/${LLM_MODEL_FILE:-chat-model.gguf}"
        if [ ! -r "$$model" ]; then
          echo "LLM model file is missing or unreadable: $$model" >&2
          echo "Set MODEL_DIR and LLM_MODEL_FILE in config/env/prod.env." >&2
          exit 2
        fi
        adapter_args=""
        if [ -n "${LLM_ADAPTER_FILE:-}" ]; then
          adapter="/models/${LLM_ADAPTER_FILE}"
          if [ ! -r "$$adapter" ] || [ -z "${LLM_ADAPTER_ID:-}" ] || [ -z "${LLM_ADAPTER_SHA256:-}" ]; then
            echo "Adapter activation requires a readable LLM_ADAPTER_FILE, LLM_ADAPTER_ID, and LLM_ADAPTER_SHA256." >&2
            exit 2
          fi
          actual_sha="$$(sha256sum "$$adapter" | cut -d ' ' -f 1)"
          if [ "$$actual_sha" != "${LLM_ADAPTER_SHA256:-}" ]; then
            echo "LLM adapter checksum mismatch: expected ${LLM_ADAPTER_SHA256:-}, found $$actual_sha." >&2
            exit 2
          fi
          adapter_args="--lora-scaled $$adapter:${LLM_ADAPTER_SCALE:-1.0}"
        fi
        exec /app/llama-server --model "$$model" $$adapter_args --alias "${LLM_MODEL:-local-chat}" --host 0.0.0.0 --port 8080 --ctx-size "${LLAMA_CTX_SIZE:-4096}" --threads "${MODEL_CPU_THREADS:-8}" --parallel "${LLAMA_PARALLEL:-1}"

  embedding-cpu:
    <<: *embedding-model-service
    profiles:
      - models-cpu
    image: ${LLAMA_CPP_CPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b9445}
    command:
      - |
        model="/models/${EMBEDDING_MODEL_FILE:-embedding-model.gguf}"
        if [ ! -r "$$model" ]; then
          echo "Embedding model file is missing or unreadable: $$model" >&2
          echo "Set MODEL_DIR and EMBEDDING_MODEL_FILE in config/env/prod.env." >&2
          exit 2
        fi
        exec /app/llama-server --model "$$model" --embedding --alias "${EMBEDDING_MODEL:-local-embedding}" --host 0.0.0.0 --port 8080 --ctx-size "${EMBEDDING_SERVER_CTX_SIZE:-2048}" --batch-size "${EMBEDDING_SERVER_BATCH_SIZE:-2048}" --ubatch-size "${EMBEDDING_SERVER_UBATCH_SIZE:-2048}" --threads "${MODEL_CPU_THREADS:-8}" --parallel "${EMBEDDING_SERVER_PARALLEL:-1}"

  llm-gpu:
    <<: *llm-model-service
    profiles:
      - models-gpu
    image: ${LLAMA_CPP_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda13-b9445}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${MODEL_GPU_COUNT:-1}
              capabilities:
                - gpu
    command:
      - |
        model="/models/${LLM_MODEL_FILE:-chat-model.gguf}"
        if [ ! -r "$$model" ]; then
          echo "LLM model file is missing or unreadable: $$model" >&2
          echo "Set MODEL_DIR and LLM_MODEL_FILE in config/env/prod.env." >&2
          exit 2
        fi
        adapter_args=""
        if [ -n "${LLM_ADAPTER_FILE:-}" ]; then
          adapter="/models/${LLM_ADAPTER_FILE}"
          if [ ! -r "$$adapter" ] || [ -z "${LLM_ADAPTER_ID:-}" ] || [ -z "${LLM_ADAPTER_SHA256:-}" ]; then
            echo "Adapter activation requires a readable LLM_ADAPTER_FILE, LLM_ADAPTER_ID, and LLM_ADAPTER_SHA256." >&2
            exit 2
          fi
          actual_sha="$$(sha256sum "$$adapter" | cut -d ' ' -f 1)"
          if [ "$$actual_sha" != "${LLM_ADAPTER_SHA256:-}" ]; then
            echo "LLM adapter checksum mismatch: expected ${LLM_ADAPTER_SHA256:-}, found $$actual_sha." >&2
            exit 2
          fi
          adapter_args="--lora-scaled $$adapter:${LLM_ADAPTER_SCALE:-1.0}"
        fi
        exec /app/llama-server --model "$$model" $$adapter_args --alias "${LLM_MODEL:-local-chat}" --host 0.0.0.0 --port 8080 --ctx-size "${LLAMA_CTX_SIZE:-4096}" --parallel "${LLAMA_PARALLEL:-1}" --n-gpu-layers "${MODEL_GPU_LAYERS:-99}" --flash-attn on

  embedding-gpu:
    <<: *embedding-model-service
    profiles:
      - models-gpu
    image: ${LLAMA_CPP_GPU_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda13-b9445}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${MODEL_GPU_COUNT:-1}
              capabilities:
                - gpu
    command:
      - |
        model="/models/${EMBEDDING_MODEL_FILE:-embedding-model.gguf}"
        if [ ! -r "$$model" ]; then
          echo "Embedding model file is missing or unreadable: $$model" >&2
          echo "Set MODEL_DIR and EMBEDDING_MODEL_FILE in config/env/prod.env." >&2
          exit 2
        fi
        exec /app/llama-server --model "$$model" --embedding --alias "${EMBEDDING_MODEL:-local-embedding}" --host 0.0.0.0 --port 8080 --ctx-size "${EMBEDDING_SERVER_CTX_SIZE:-2048}" --batch-size "${EMBEDDING_SERVER_BATCH_SIZE:-2048}" --ubatch-size "${EMBEDDING_SERVER_UBATCH_SIZE:-2048}" --parallel "${EMBEDDING_SERVER_PARALLEL:-1}" --n-gpu-layers "${MODEL_GPU_LAYERS:-99}" --flash-attn on

networks:
  application:
    internal: true
  edge:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  api_storage:
  postgres_data:
  redis_data:
